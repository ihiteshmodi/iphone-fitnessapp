name: FitnessApp
options:
  bundleIdPrefix: com.hitesh
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
packages:
  FitnessCore:
    path: .
targets:
  FitnessApp:
    type: application
    platform: iOS
    sources:
      - path: app
    # An exported database in output/fitness.sqlite is bundled and offered as "Load my data" on first launch (see
    # ImportDatabaseView). It holds personal data and is not in the repository, so without it the build just skips it.
    postCompileScripts:
      - name: Bundle exported database (optional)
        basedOnDependencyAnalysis: false
        script: |
          SEED="${SRCROOT}/output/fitness.sqlite"
          DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/fitness.sqlite"
          if [ -f "$SEED" ]; then
            cp -f "$SEED" "$DEST"
            echo "Bundled output/fitness.sqlite"
          else
            rm -f "$DEST"
            echo "note: output/fitness.sqlite not found, building without bundled data"
          fi
    dependencies:
      - package: FitnessCore
    info:
      path: app/Info.plist
      properties:
        CFBundleDisplayName: Fitness
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hitesh.fitnessapp
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
  FitnessAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: appUITests
    dependencies:
      - target: FitnessApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hitesh.fitnessapp.uitests
        TEST_TARGET_NAME: FitnessApp
schemes:
  FitnessApp:
    build:
      targets:
        FitnessApp: all
    test:
      targets:
        - FitnessAppUITests
