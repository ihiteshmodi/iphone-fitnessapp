name: FitnessApp
options:
  bundleIdPrefix: com.hitesh
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
packages:
  FitnessCore:
    path: .
targets:
  FitnessApp:
    type: application
    platform: iOS
    sources:
      - path: app
      # The seeded database ships inside the app so first launch needs no file picker (see ImportDatabaseView).
      # Optional: the file holds personal data and is not in the repository.
      - path: output/fitness.sqlite
        optional: true
        buildPhase: resources
    dependencies:
      - package: FitnessCore
    info:
      path: app/Info.plist
      properties:
        CFBundleDisplayName: Fitness
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hitesh.fitnessapp
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: NO
  FitnessAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: appUITests
    dependencies:
      - target: FitnessApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hitesh.fitnessapp.uitests
        TEST_TARGET_NAME: FitnessApp
schemes:
  FitnessApp:
    build:
      targets:
        FitnessApp: all
    test:
      targets:
        - FitnessAppUITests
